; AC7 DLSS Enhancer - Ctrl+Shift+F11 reloads settings.
; Enabled: 0=off, 1=on. Disable the game's FXAA.

[SuperResolution]
Enabled=1
; 0=Quality, 1=Balanced, 2=Performance.
QualityMode=0
; Sharpening strength: 0-1; 0=off.
Sharpness=0.3

[NeuralRendering]
Enabled=1
; Effect strengths: 0-1.
EffectStrength=1.0
ToneStrength=0.3
DetailStrength=1.0
; 0=A, 1=B, 2=C.
Preset=2
; Reduce quality at screen edges to improve performance. 0=off, 1=on.
OptimizeEdges=1
; Full-quality centre aspect ratio: 1.3333333=4:3. Range: 0.1-8.
CenterAspectRatio=1.3333333
; Edge quality: 0.25-1; higher keeps more detail.
EdgeQuality=0.5
; Transition width per side, as a fraction of screen width: 0-0.5.
BlendWidth=0.05

[FrameGeneration]
; Automatically pauses in menus, the hangar and paused gameplay.
Enabled=1
; 0=Auto, 1=off, 2+=fixed total multiplier.
; Auto targets the game FPS cap, or display refresh when unlimited.
; VSync takes priority. Fixed multipliers keep the game's FPS cap.
; Unsupported Auto uses the highest fixed multiplier; requests above the maximum are capped.
Multiplier=0
